[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "simple_config_builder"
version = "1.6.0"
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "Gehlen, Joshua", email = "joshuagehlen@hotmail.com" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click",
  "toml",
  "pyaml",
  "fastapi[all]",
]

[project.optional-dependencies]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-material-extensions",
  "mkdocs-autorefs",
  "mkdocs-include-markdown-plugin",
  "mike",
  ]



[project.urls]
Documentation = "https://jogehl.github.io/config"
Issues = "https://github.com/jogehl/config/issues"
Source = "https://github.com/jogehl/config"

[project.scripts]
simple_config_builder = "simple_config_builder.cli:config"

[tool.maturin]
python-source = "src"
module-name = "simple_config_builder._native"
features = ["pyo3/extension-module"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
# Run unit tests (requires `maturin develop` first to build the native extension)
test = "pytest {args:tests}"
# Run doctests embedded in module docstrings (requires `maturin develop` first)
doctest = "pytest --doctest-modules {args:src/simple_config_builder}"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/config tests}"

[tool.hatch.envs.hatch-static-analysis]
config-path = "ruff.toml"

[tool.coverage.run]
source_pkgs = ["simple_config_builder", "tests"]
branch = true
parallel = true
omit = [
  "src/simple_config_builder/__about__.py",
]

[tool.coverage.paths]
config = ["src/simple_config_builder"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
