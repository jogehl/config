name: ConfigCI
on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - major
          - minor
          - patch


jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build crates
        run: cargo build --workspace --all-features
      - name: Run tests
        run: cargo test --workspace --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch ruff
          hatch env create
      - name: Run tests
        run: |
          hatch test
      - name: Run format check
        run: |
          ruff check

  build:
    needs: [rust, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch ruff
          hatch env create
      - name: Build package
        run: |
          hatch build
  
  increase-version:
    # only run when manually triggered via workflow_dispatch
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch ruff
          hatch env create
      - name: Increase version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          hatch version ${{ github.event.inputs.bump_type || 'minor' }}
          git add .
          git commit -m "Increase version ($(hatch version))"
          git push
          git tag -a $(hatch version) -m "Increase version ($(hatch version))"
          git push origin --tags
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    # only runs in the same workflow_dispatch run, after version bump
    if: github.event_name == 'workflow_dispatch'
    needs: increase-version
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch --prune --unshallow
          git pull origin main
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch ruff
          hatch env create
          hatch build
      - name: Deploy package
        run: |
          hatch publish -u __token__ -a ${{ secrets.PYPI_TOKEN }}
    env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    # runs in the same workflow_dispatch run, after version bump
    # No PAT or tag trigger needed — jobs in the same run share the token.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    needs: increase-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch --prune --unshallow
          git pull origin main
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch ruff
          hatch env create
          pip install -e .[docs]
      - name: Deploy pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git fetch origin gh-pages --depth=1
          mike deploy $(hatch version)
          mike set-default $(hatch version) --push
    env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      