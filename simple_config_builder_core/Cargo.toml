[package]
name = "simple_config_builder_core"
version = "1.6.0"
edition = "2021"
license = "MIT"
description = "Pure Rust core for simple_config_builder"

[features]
default = ["yaml", "toml"]
yaml = ["dep:serde_yml"]
toml = ["dep:toml"]

[dependencies]
garde = { version = "0.22", features = ["derive"] }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = { version = "0.0.12", optional = true }
toml = { version = "1", optional = true }